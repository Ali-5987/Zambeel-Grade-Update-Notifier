name: grade-notifier
on:
  schedule:
    - cron: '0,30 5-16 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dotenv schedule

      - name: Run Script
        env:
          ZAMBEEL_USER: ${{ secrets.ZAMBEEL_USER }}
          ZAMBEEL_PASS: ${{ secrets.ZAMBEEL_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          UNI_EMAIL: ${{ secrets.UNI_EMAIL }}
          EMP_ID: ${{ secrets.EMP_ID }}
        run: python script.py
      
      - name: commit new data
        run: |
            git config --global user.name "Grade Watcher Bot"
            git config --global user.email "actions@github.com"
            git add last_grades.json
            git diff --staged --quiet || git commit
            git push